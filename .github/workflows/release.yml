name: Build and publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"
          --title "Multi Transit Card Reader ${GITHUB_REF_NAME}"
          --notes "Experimental, debug-signed APK for direct testing on NFC-capable Android phones. Select the exact card in the app before scanning so it uses the correct read-only NFC protocol. Profiles include Octopus, EasyCard, iPASS, EZ-Link/CEPAS, Suica, PASMO, ICOCA, Yangchengtong, Shenzhentong, China T-Union, Clipper, Macau Pass, and Touch 'n Go. Balance availability depends on the card generation and whether its data is public; see the README for the support matrix and limitations."
