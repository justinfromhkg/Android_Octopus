name: Build and publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"
          --title "Multi Transit Card Reader ${GITHUB_REF_NAME}"
          --notes "Experimental, debug-signed APK for direct testing on NFC-capable Android phones. Streamlines the language and Octopus selectors while retaining the app-only language picker and the Sold (-HK$35) versus On-Loan/electronic (-HK$50) Octopus options. Automatic detection still shows separate results for every detected core, including Octopus + Shenzhentong/T-Union multi-core cards. See the README for protected-card and balance limitations."
