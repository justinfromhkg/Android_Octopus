name: Build and publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"
          --title "Multi Transit Card Reader ${GITHUB_REF_NAME}"
          --notes "Experimental, debug-signed APK for direct testing on NFC-capable Android phones. Adds a selectable HK$35/HK$50 Octopus balance basis for older physical versus newer/mobile cards, expanded FeliCa metadata, T-Union card information, alternate public purse fallback, and up to 10 decoded public T-Union transaction records. Route and station names require verified issuer-specific mappings, so stored codes are shown when names are unavailable. Includes English, Traditional Chinese, Simplified Chinese, Japanese, Korean, and Malay. See the README for the support matrix and limitations."
