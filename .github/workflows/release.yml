name: Build and publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "Multi_Transit_Card_Reader-${GITHUB_REF_NAME}.apk"
          --title "Multi Transit Card Reader ${GITHUB_REF_NAME}"
          --notes "Experimental, debug-signed APK for direct testing on NFC-capable Android phones. Fixes Octopus + Shenzhentong/T-Union multi-system cards by explicitly polling Octopus FeliCa system 8008 while preserving the selectable HK$35 basis for older physical cards and HK$50 for newer/mobile cards. Adds T-money public balance, card details, and recent transaction reads, plus safe Oyster MIFARE Classic/DESFire generation metadata; Oyster balance data remains protected and no keys are guessed. Includes English, Traditional Chinese, Simplified Chinese, Japanese, Korean, and Malay. See the README for the support matrix and limitations."
